[package]
name = "quantamfs"
version = "0.1.0"
description = "QuantamFS desktop client"
edition = "2021"

[lib]
name = "quantamfs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The desktop app links the protocol core and runs member nodes in process
# (docs/decisions/client-backend-embed.md). No other crates: the node module
# writes its own hex/Base32 helpers rather than pulling more dependencies in.
quantam-fs = { path = "../../backend" }
tokio = { version = "1", features = ["rt", "sync", "macros", "time", "net", "io-util"] }
# One exception to the note above: the client id is a SHA-256 of machine + data dir, and the
# backend already builds `sha2` (it exposes no general-purpose digest of its own).
sha2 = "0.10"

# Snappy dev builds: our crate lightly optimized, dependencies more so.
# Incremental compilation stays on (cargo's default for dev).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
