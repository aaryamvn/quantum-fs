[package]
name = "quantamfs"
version = "0.1.0"
description = "QuantamFS desktop client"
edition = "2021"

[lib]
name = "quantamfs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Snappy dev builds: our crate lightly optimized, dependencies more so.
# Incremental compilation stays on (cargo's default for dev).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
