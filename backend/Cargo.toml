[package]
name = "quantam-fs"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "quantam_fs"
path = "src/lib.rs"

[[bin]]
name = "qfsd"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "signal"] }
